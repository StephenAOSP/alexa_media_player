preview_custom:
  name: Preview custom command (offline)
  description: Compare hypothetical payloads without contacting Amazon.
  fields:
    command:
      name: Command
      required: true
      selector:
        text:
    suppress_response:
      name: Include hypothetical suppression field
      default: true
      selector:
        boolean:
live_baseline:
  name: Live baseline on living room Echo
  description: Real alarm command; may speak or beep. No suppression.
  fields:
    confirm_live_test:
      name: Confirm live test
      required: true
      selector:
        boolean:
live_candidate:
  name: Live experimental suppression candidate on living room Echo
  description: >-
    REAL COMMAND. Creates or updates an 8 a.m. ABBA Amazon Music alarm
    using existing Alexa Media Player, with an UNVERIFIED suppression flag.
    Echo may speak or beep; do not expect silence. Check for duplicate alarms.
  fields:
    confirm_live_test:
      name: Confirm real test with unverified flag
      required: true
      selector:
        boolean:

inspect_request_path:
  name: Inspect AlexaPy request building (read-only)
  description: >-
    Inspects locally installed AlexaPy method code with string literals redacted.
    No Amazon requests, commands, alarms or volume changes.

preview_v5:
  name: V5 preview request injection (offline)
  description: Checks AlexaPy installed code and proposed payload without sending an Amazon request.
live_v5:
  name: V5 live suppression candidate (real alarm)
  description: >-
    REAL 8 a.m. ABBA alarm request on living room Echo. Injects unverified
    suppressResponse into Alexa.TextCommand operationPayload. Alexa may speak.
    Check and remove duplicate alarms afterwards.
  fields:
    confirm_live_test:
      name: Confirm live alarm test
      required: true
      selector:
        boolean:

inspect_v6:
  name: V6 inspect alternative Alexa command pathways (read-only)
  description: >-
    Local static inspection of AlexaPy method names and known operation identifiers.
    No Amazon calls, voice commands, alarm creation, or volume changes.
